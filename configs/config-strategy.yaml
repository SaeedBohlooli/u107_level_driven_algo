stop_losses:
    - right == 'C' and case != 'case_manual' 
        and underlying_previous_candle_close < level_used_to_open - tolerance_amount 
        and underlying_current_price < underlying_previous_candle_close
    - right == 'P' and case != 'case_manual' 
        and underlying_previous_candle_close > level_used_to_open + tolerance_amount 
        and underlying_current_price > underlying_previous_candle_close
    - right == 'C' and user_defined_stop_loss !=0 and underlying_current_price < user_defined_stop_loss
    - right == 'P' and user_defined_stop_loss !=0 and underlying_current_price > user_defined_stop_loss
#    - right == 'C' and case in ('case_7', 'case_8')
#        and underlying_previous_candle_close < level_used_to_open - tolerance_amount
#    - right == 'P' and case in ('case_7', 'case_8')
#        and underlying_previous_candle_close > level_used_to_open + tolerance_amount
#    - current_bid < entry_price * 0.70

take_profits:
  t1:
    enabled: false
    condition: >
      (current_bid > entry_price * percentage_change or current_bid - entry_price > absolute_change)
      and entry_price not in [0,-1] and current_bid not in [0,-1]
    close_quantity_percentage: 0.8
    close_quantity_numbner: total - number_of_trails
    memo: Taking some profit at 15% or 0.20 with 4 of 6 - percentage_change comes from config

  t2:
    enabled: false
    condition: >
      (current_bid > entry_price * 1.30 or current_bid - entry_price > 0.70)
      and entry_price not in [0,-1] and current_bid not in [0,-1]
    close_quantity_percentage: 0.20
    memo: Taking some profit at 30% or 0.80 with 1 of 6

  t3:
    enabled: false
    condition: >
      (current_bid > entry_price * 1.60 )
      and entry_price not in [0,-1] and current_bid not in [0,-1]
    close_quantity_percentage: -1
    memo: Taking all profit at 60%

  t4_ev_if_t1:
    enabled: false
    condition: >
      (right == 'C' and is_executed_take_profits(application_state, symbol, take_profit_list=['t1']) 
        and underlying_previous_candle_close < entry_underlying_price)
      or
      (right == 'P' and is_executed_take_profits(application_state, symbol, take_profit_list=['t1']) 
        and underlying_previous_candle_close > entry_underlying_price)
    close_quantity_percentage: -1
    memo: This is for break even - if we hit TP1, then we go for break even

  t4_ev_if_t2:
    enabled: false
    condition: >
      (right == 'C' and is_executed_take_profits(application_state, symbol, take_profit_list=['t2']) 
        and underlying_previous_candle_close < entry_underlying_price)
      or
      (right == 'P' and is_executed_take_profits(application_state, symbol, take_profit_list=['t2']) 
        and underlying_previous_candle_close > entry_underlying_price)
    close_quantity_percentage: -1
    memo: This is for break even - if we hit TP2, then we go for break even

  t5_cr_lv:
    enabled: false
    condition: >
      (right == 'C' and is_price_crossed_levels(application_state, side='up', symbol=symbol, next_levels=['PDH'], 
            current_price=underlying_current_price, entry_underlying_price=entry_underlying_price))
      or
      (right == 'P' and is_price_crossed_levels(application_state, side='down', symbol=symbol, next_levels=['PDL'], 
            current_price=underlying_current_price, entry_underlying_price=entry_underlying_price))
    close_quantity_percentage: 0.5
    memo: if we entered below major level and crossing level, we dump some ...

  t6_trail_t1:
    enabled: false
    condition: check_mark_revers_candles(application_state, symbol, take_profit_alias='t2', market_data=market_data)
    close_quantity_percentage: -1
    memo: for long after tp1, if we go below last down close candle, then we close the position and vice versa for short

  t6_trail_w_ema_21:
    enabled: false
    condition: >
        ( right == 'C' 
          and is_executed_take_profits(application_state, symbol, take_profit_list=['t1']) 
          and symbol_df['close'].iloc[-2] > symbol_df['ema_21'].iloc[-2] 
          and symbol_df['close'].iloc[-3] > symbol_df['ema_21'].iloc[-3]
          and symbol_df['close'].iloc[-1] < symbol_df['ema_21'].iloc[-1]
        )
        or
        ( right == 'P' 
          and is_executed_take_profits(application_state, symbol, take_profit_list=['t1']) 
          and symbol_df['close'].iloc[-2] < symbol_df['ema_21'].iloc[-2] 
          and symbol_df['close'].iloc[-3] < symbol_df['ema_21'].iloc[-3]
          and symbol_df['close'].iloc[-1] > symbol_df['ema_21'].iloc[-1]
        )
    close_quantity_percentage: -1
    memo: for long after tp1, if we go below last down close candle, then we close the position and vice versa for short

  # Always keep this enable
  # This is for user defined take profit, if user set the take profit, then we will close the position based on that
  t7_user_defined_take_profit:
    enabled: true
    always_run: true
    multiple_run: true
    close_type: "real_absolute"
    condition: >
      (right == 'C' and underlying_current_price > user_defined_take_profit and user_defined_take_profit not in [0,-1])
      or
      (right == 'P' and underlying_current_price < user_defined_take_profit and user_defined_take_profit not in [0,-1])
    close_quantity_numbner: user_defined_take_profit_quantity
    memo:

  t10_cl_manual: # This is for closing everything just NVDA:   1 == 1 and symbol == 'NVDA'
    enabled: False
    condition: 1 == 2 and symbol == 'AMZN'
    close_quantity_percentage: .5

  t11_cl_manual: # This is for closing everything just NVDA:   1 == 1 and symbol == 'NVDA'
    enabled: False
    condition: 1 == 3 and symbol == 'TSLA'
    close_quantity_percentage: -1


