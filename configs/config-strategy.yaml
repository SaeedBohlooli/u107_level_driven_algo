
cases:
  case_2:
    memo: 5MH and 5ML breakout_ver_2, no short above PDH, trade close to level. - we running this one - 2.1 improved
    can_replace_level: true
    precondition: all_levels_in(application_state, symbol)
    color: blue
    long:
      level: levels['5MH']
      level_alias: "5MH"
      cores:
        - breakout_in_last_x_candles_ver_4(app_config, application_state, case, symbol, df, side='up', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=long_level, level_alias=level_alias)
        - price_retest(app_config, application_state, case, symbol, df, side='up', idx_list=[-2,-3,-4], level=long_level, both_sides=True, level_alias=level_alias)
        - set_and_is_retest_after_breakout(application_state, symbol, case, side='up', level=long_level)
        - check_entry_vs_retest(application_state, case, symbol, df, side='up', level=long_level)
        # 5
        - no_failure_after_breakout(application_state, case, symbol, df, side='up', level=long_level, ohlc_field='close')
        - check_price_vs_level(app_config, symbol, side='up', price=price, level=long_level )
        - 930 < get_last_record_hh_mm(df) < 1016 or get_mode(application_state) == 'live'
      extras:
        - skip_level_closeness_enabled or not is_price_close_to_next_levels_ver_2(app_config, application_state, case, symbol, df, side='up', price=price, current_level=long_level, next_levels=['PDH'])
        - abs (price - long_level) < 1.2 * atr_14
        # 10
        - 10 == 10 and price > application_state['levels'][symbol]['PDL']
        - skip_pdhl_and_qqq_check_enabled or price < levels['PDH'] or get_current_price(ib, application_state, 'QQQ') > application_state['levels']['QQQ']['5MH'] # avoid going long above PDH - extra safety- if we are above PDH, low change we continue after 5MH breakout.
        - abs (price - long_level) < 2
        - qqq_df['close'].iloc[-1] > qqq_df['open'].iloc[-1]  # forming candle.

        # TODO get the range of 5MH and 5ML and check the current price is close to 5MHL and 5ML

    short:
      level: levels['5ML']
      level_alias: "5ML"
      cores:
        - breakout_in_last_x_candles_ver_4(app_config, application_state, case, symbol, df, side='down', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=short_level, level_alias=level_alias)
        - price_retest(app_config, application_state, case, symbol, df, side='down', idx_list=[-2,-3,-4], level=short_level, both_sides=True ,level_alias=level_alias)
        - set_and_is_retest_after_breakout(application_state, symbol, case, side='down', level=short_level)
        - check_entry_vs_retest(application_state, case, symbol, df, side='down', level=short_level)
        # 5
        - no_failure_after_breakout(application_state, case, symbol, df, side='down', level=short_level, ohlc_field='close')
        - check_price_vs_level(app_config, symbol, side='down', price=price, level=short_level )
        - 930 < get_last_record_hh_mm(df) < 1016 or get_mode(application_state) == 'live'
      extras:
        - not is_price_close_to_next_levels_ver_2(app_config, application_state, case, symbol, df, side='down', price=price, current_level=short_level, next_levels=['PDL'])
        - abs (price - short_level) < 1.2 * atr_14
        # 10
        - 10 == 10 and price < application_state['levels'][symbol]['PDH'] # avoid going long above PDH - extra safety- if we are above PDH, low change we continue after 5MH breakout
        - price > levels['PDL'] or get_current_price(ib, application_state, 'QQQ') < application_state['levels']['QQQ']['5ML']
        - abs (price - short_level) < 2
        - qqq_df['close'].iloc[-1] < qqq_df['open'].iloc[-1]

