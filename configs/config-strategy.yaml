reserves:

  # N candles before the breakout, ALL closes must be above the level
  # for AMD 11-19 ....
  d: c


cases:

  case_7:
    memo: based on the R2
    can_replace_level: false
    precondition: all_levels_in(application_state, symbol)
    color: orange
    long:
      level: levels['5MH']
      level_alias: "5MH"
      cores:
        - breakout_in_last_x_candles_ver_4(app_config, application_state, case, symbol, df, side='up', idx_list=list(range(-3,-25,-1)), level=long_level, level_alias=level_alias)
        - price_retest_v2(app_config, application_state, case, symbol, df, side='up', idx_list=[-2,-3], level=long_level, level_alias=level_alias)
        - set_and_is_retest_after_breakout(application_state, symbol, case, side='up', level=long_level)
        - does_arc_has_enough_heights(app_config, application_state, case, symbol, df, side='up', level=long_level, level_alias=level_alias, min_height_atr_ratio=0.5)
        - check_arc_duration(app_config, application_state, case, symbol, df, side='up', level=long_level, level_alias=level_alias, arc_min_bars=4)
#        - check_close_displacement(app_config, application_state, case, symbol, df, side='up', level=long_level, level_alias=level_alias, min_close_disp_atr=0.1)
        - check_arc_hump(app_config, application_state, case, symbol, df, side='up', level=long_level, level_alias=level_alias)
        - price > long_level and df.iloc[-1]['open'] > long_level and df.iloc[-1]['close'] > df.iloc[-1]['open']
      extras:
        - is_second_candle_after(min_seconds=30)
        - has_strong_close(df, side='up')
        - df.iloc[-1]['close'] > long_level + 0.5 * df.iloc[-2]['atr_14'] or df.iloc[-1]['close'] > df.iloc[-2]['high']
        - 1 == 1 or is_symbol_in_rs_shortlist(app_config, application_state, symbol, side='up', threshold=5)
        - abs(df.iloc[-1]['open'] - df.iloc[-1]['close']) > 0.25 * df.iloc[-2]['atr_14']
        - abs(df.iloc[-1]['open'] - df.iloc[-1]['close']) > 0.10
        - arc_does_not_cross_level(application_state, case, symbol, df, long_level, side='up', tolerance=0.5)
        - check_pre_breakout_alignment(app_config, application_state, case, symbol, df, side='up', level=long_level, level_alias=level_alias, n_candles=5, threshold_atr_ratio=0.5)
        - check_arc_concavity(application_state, case, symbol, df, long_level, side='up', min_concavity_ratio=2.0)


    short:
      level: levels['5ML']
      level_alias: "5ML"
      cores:
        - breakout_in_last_x_candles_ver_4(app_config, application_state, case, symbol, df, side='down', idx_list=list(range(-3,-25,-1)), level=short_level, level_alias=level_alias)
        - price_retest_v2(app_config, application_state, case, symbol, df, side='down', idx_list=[-2,-3], level=short_level, level_alias=level_alias)
        - set_and_is_retest_after_breakout(application_state, symbol, case, side='down', level=short_level)
        - does_arc_has_enough_heights(app_config, application_state, case, symbol, df, side='down', level=short_level, level_alias=level_alias, min_height_atr_ratio=0.5)
        - check_arc_duration(app_config, application_state, case, symbol, df, side='down', level=short_level, level_alias=level_alias, arc_min_bars=4)
#        - check_close_displacement(app_config, application_state, case, symbol, df, side='down', level=short_level, level_alias=level_alias, min_close_disp_atr=0.1)
        - check_arc_hump(app_config, application_state, case, symbol, df, side='down', level=short_level, level_alias=level_alias)
        - price < short_level and df.iloc[-1]['open'] < short_level and df.iloc[-1]['close'] < df.iloc[-1]['open']
      extras:
        - is_second_candle_after(min_seconds=30)
        - has_strong_close(df, side='down')
        - df.iloc[-1]['close'] < short_level - 0.5 * df.iloc[-2]['atr_14'] or df.iloc[-1]['close'] < df.iloc[-2]['low']
        - 1 == 1 or is_symbol_in_rs_shortlist(app_config, application_state, symbol, side='down', threshold=5)
        - abs(df.iloc[-1]['open'] - df.iloc[-1]['close']) > 0.25 * df.iloc[-2]['atr_14']
        - abs(df.iloc[-1]['open'] - df.iloc[-1]['close']) > 0.10
        - arc_does_not_cross_level(application_state, case, symbol, df, short_level, side='down', tolerance=0.5)
        - check_pre_breakout_alignment(app_config, application_state, case, symbol, df, side='down', level=short_level, level_alias=level_alias, n_candles=5, threshold_atr_ratio=0.5)
        - check_arc_concavity(application_state, case, symbol, df, short_level, side='down', min_concavity_ratio=2.0)

  case_8:
    memo: based on the R2
    can_replace_level: false
    precondition: all_levels_in(application_state, symbol)
    color: deeppink
    long:
      level: levels['PDH']
      level_alias: "PDH"
      cores:
        - breakout_in_last_x_candles_ver_4(app_config, application_state, case, symbol, df, side='up', idx_list=list(range(-3,-25,-1)), level=long_level, level_alias=level_alias)
        - price_retest_v2(app_config, application_state, case, symbol, df, side='up', idx_list=[-2,-3], level=long_level, level_alias=level_alias)
        - set_and_is_retest_after_breakout(application_state, symbol, case, side='up', level=long_level)
        - does_arc_has_enough_heights(app_config, application_state, case, symbol, df, side='up', level=long_level, level_alias=level_alias, min_height_atr_ratio=0.5)
        - check_arc_duration(app_config, application_state, case, symbol, df, side='up', level=long_level, level_alias=level_alias, arc_min_bars=4)
#        - check_close_displacement(app_config, application_state, case, symbol, df, side='up', level=long_level, level_alias=level_alias, min_close_disp_atr=0.1)
        - check_arc_hump(app_config, application_state, case, symbol, df, side='up', level=long_level, level_alias=level_alias)
        - price > long_level and df.iloc[-1]['open'] > long_level and df.iloc[-1]['close'] > df.iloc[-1]['open']
      extras:
        - is_second_candle_after(min_seconds=30)
        - has_strong_close(df, side='up')
        - df.iloc[-1]['close'] > long_level + 0.5 * df.iloc[-2]['atr_14'] or df.iloc[-1]['close'] > df.iloc[-2]['high']
        - 1 == 1 or is_symbol_in_rs_shortlist(app_config, application_state, symbol, side='up', threshold=5)
        - abs(df.iloc[-1]['open'] - df.iloc[-1]['close']) > 0.25 * df.iloc[-2]['atr_14']
        - abs(df.iloc[-1]['open'] - df.iloc[-1]['close']) > 0.10
        - arc_does_not_cross_level(application_state, case, symbol, df, long_level, side='up', tolerance=0.5)
        - check_pre_breakout_alignment(app_config, application_state, case, symbol, df, side='up', level=long_level, level_alias=level_alias, n_candles=5, threshold_atr_ratio=0.5)
        - check_arc_concavity(application_state, case, symbol, df, long_level, side='up', min_concavity_ratio=2.0)

    short:
      level: levels['PDL']
      level_alias: "PDL"
      cores:
        - breakout_in_last_x_candles_ver_4(app_config, application_state, case, symbol, df, side='down', idx_list=list(range(-3,-25,-1)), level=short_level, level_alias=level_alias)
        - price_retest_v2(app_config, application_state, case, symbol, df, side='down', idx_list=[-2,-3], level=short_level, level_alias=level_alias)
        - set_and_is_retest_after_breakout(application_state, symbol, case, side='down', level=short_level)
        - does_arc_has_enough_heights(app_config, application_state, case, symbol, df, side='down', level=short_level, level_alias=level_alias, min_height_atr_ratio=0.5)
        - check_arc_duration(app_config, application_state, case, symbol, df, side='down', level=short_level, level_alias=level_alias, arc_min_bars=4)
#        - check_close_displacement(app_config, application_state, case, symbol, df, side='down', level=short_level, level_alias=level_alias, min_close_disp_atr=0.1)
        - check_arc_hump(app_config, application_state, case, symbol, df, side='down', level=short_level, level_alias=level_alias)
        - price < short_level and df.iloc[-1]['open'] < short_level and df.iloc[-1]['close'] < df.iloc[-1]['open']
      extras:
        - is_second_candle_after(min_seconds=30)
        - has_strong_close(df, side='down')
        - df.iloc[-1]['close'] < short_level - 0.5 * df.iloc[-2]['atr_14'] or df.iloc[-1]['close'] < df.iloc[-2]['low']
        - 1 == 1 or is_symbol_in_rs_shortlist(app_config, application_state, symbol, side='down', threshold=5)
        - abs(df.iloc[-1]['open'] - df.iloc[-1]['close']) > 0.25 * df.iloc[-2]['atr_14']
        - abs(df.iloc[-1]['open'] - df.iloc[-1]['close']) > 0.10
        - arc_does_not_cross_level(application_state, case, symbol, df, short_level, side='down', tolerance=0.5)
        - check_pre_breakout_alignment(app_config, application_state, case, symbol, df, side='down', level=short_level, level_alias=level_alias, n_candles=5, threshold_atr_ratio=0.5)
        - check_arc_concavity(application_state, case, symbol, df, short_level, side='down', min_concavity_ratio=2.0)




stop_losses:
  sl_1:
    enabled: true
    condition: >
      (right == 'C' and case != 'case_manual' 
          and underlying_previous_candle_close < level_used_to_open - tolerance_amount 
          and underlying_current_price < underlying_previous_candle_close 
          and underlying_current_price < symbol_df['low'].iloc[-2])
      or
      (right == 'P' and case != 'case_manual' 
          and underlying_previous_candle_close > level_used_to_open + tolerance_amount 
          and underlying_current_price > underlying_previous_candle_close
          and underlying_current_price > symbol_df['high'].iloc[-2])
    memo: sl_1

  sl_user_defined:
    enabled: true
    condition: >
      (right == 'C' and user_defined_stop_loss !=0 and underlying_current_price < user_defined_stop_loss)
      or
      (right == 'P' and user_defined_stop_loss !=0 and underlying_current_price > user_defined_stop_loss)
    memo: sl_user_defined


  sl_max_20_percent:
    enabled: false
    condition: >
      current_bid < entry_price * 0.80
    memo: sl_max_20_percent

  sl_max_30_percent:
    enabled: false
    condition: >
      current_bid < entry_price * 0.70
    memo: sl_max_30_percent

  sl_max_x_percent:
    enabled: false
    condition: >
      current_bid < entry_price * ( 1 - max_loss_percentage)
    max_loss_percentage: 0.3
    memo: sl_max_x_percent


take_profits:

  tp1_absolute:
    enabled: false
    condition: >
      (current_bid - entry_price > absolute_change)
      and entry_price not in [0,-1] and current_bid not in [0,-1]
      and not is_executed_take_profits(application_state, symbol, take_profit_list=['tp1'])
    absolute_change: 0.15
    close_type: "percentage"  # absolute or percentage
    close_quantity_percentage: 0.7
    close_quantity_remaining: 1
    memo: Taking some profit at 15% or 0.15 with 4 of 6 - percentage_change comes from config

  tp1_percentage:
    enabled: false
    condition: >
      (current_bid > entry_price * (1 + percentage_change))
      and entry_price not in [0,-1] and current_bid not in [0,-1]
      and not is_executed_take_profits(application_state, symbol, take_profit_list=['tp1'])
    percentage_change: 0.12
    close_type: "percentage"  # absolute or percentage
    close_quantity_percentage: 0.7
    close_quantity_remaining: 1
    memo: Taking some profit at 15% or 0.15 with 4 of 6 - percentage_change comes from config

  tp1_percentage_configurable:
    enabled: false
    condition: >
      current_bid > entry_price * (1 + percentage_change) 
      and entry_price not in [0,-1] and current_bid not in [0,-1]
      and not is_executed_take_profits(application_state, symbol, take_profit_list=['tp1'])
    percentage_change: 0.15
    close_type: "percentage"  # absolute or percentage
    close_quantity_percentage: 0.8
    close_quantity_remaining: 1
    memo: Taking some profit at 15% or 0.20 with 4 of 6 - percentage_change comes from config

  tp2:
    enabled: false
    condition: >
      (current_bid > entry_price * 1.30 or current_bid - entry_price > 0.70)
      and entry_price not in [0,-1] and current_bid not in [0,-1]
    close_quantity_percentage: 0.20
    close_type: "percentage"  # absolute or percentage
    memo: Taking some profit at 30% or 0.80 with 1 of 6

  tp3:
    enabled: false
    condition: >
      (current_bid > entry_price * 1.60 )
      and entry_price not in [0,-1] and current_bid not in [0,-1]
    close_quantity_percentage: 1
    memo: Taking all profit at 60%

  tp4_ev_if_tp1:
    enabled: false
    condition: >
      (right == 'C' and is_executed_take_profits(application_state, symbol, take_profit_list=['tp1']) 
        and underlying_previous_candle_close < entry_underlying_price)
      or
      (right == 'P' and is_executed_take_profits(application_state, symbol, take_profit_list=['tp1']) 
        and underlying_previous_candle_close > entry_underlying_price)
    close_quantity_percentage: 1
    memo: This is for break even - if we hit TP1, then we go for break even

  tp4_ev_if_tp2:
    enabled: false
    condition: >
      (right == 'C' and is_executed_take_profits(application_state, symbol, take_profit_list=['tp2']) 
        and underlying_previous_candle_close < entry_underlying_price)
      or
      (right == 'P' and is_executed_take_profits(application_state, symbol, take_profit_list=['tp2']) 
        and underlying_previous_candle_close > entry_underlying_price)
    close_quantity_percentage: 1
    memo: This is for break even - if we hit TP2, then we go for break even

  tp5_cr_lv:
    enabled: false
    condition: >
      (right == 'C' and is_price_crossed_levels(application_state, side='up', symbol=symbol, next_levels=['PDH'], 
            current_price=underlying_current_price, entry_underlying_price=entry_underlying_price))
      or
      (right == 'P' and is_price_crossed_levels(application_state, side='down', symbol=symbol, next_levels=['PDL'], 
            current_price=underlying_current_price, entry_underlying_price=entry_underlying_price))
    close_quantity_percentage: 0.5
    memo: if we entered below major level and crossing level, we dump some ...

  tp6_trail_tp1:
    enabled: false
    condition: check_mark_revers_candles(application_state, symbol, take_profit_alias='tp2', market_data=market_data)
    close_quantity_percentage: 1
    memo: for long after tp1, if we go below last down close candle, then we close the position and vice versa for short

  tp6_trail_w_ema_9:
    enabled: false
    condition: >
        ( right == 'C' 
          and current_bid > entry_price
          and (skip_tp1_check or is_executed_take_profits(application_state, symbol, take_profit_list=['tp1'])) 
          and symbol_df['close'].iloc[-4] > symbol_df['ema_9'].iloc[-4] 
          and symbol_df['close'].iloc[-3] > symbol_df['ema_9'].iloc[-3]
          and symbol_df['close'].iloc[-2] < symbol_df['ema_9'].iloc[-2]
        )
        or
        ( right == 'P' 
          and current_bid > entry_price
          and (skip_tp1_check or is_executed_take_profits(application_state, symbol, take_profit_list=['tp1'])) 
          and symbol_df['close'].iloc[-4] < symbol_df['ema_9'].iloc[-4]
          and symbol_df['close'].iloc[-3] < symbol_df['ema_9'].iloc[-3] 
          and symbol_df['close'].iloc[-2] > symbol_df['ema_9'].iloc[-2]
        )
    close_quantity_percentage: 1
    skip_tp1_check: false
    memo: for long after tp1, if we go below last down close candle, then we close the position and vice versa for short


  tp6_trail_w_ema_21:
    enabled: false
    condition: >
        ( right == 'C' 
          and current_bid > entry_price
          and (skip_tp1_check or is_executed_take_profits(application_state, symbol, take_profit_list=['tp1'])) 
          and symbol_df['close'].iloc[-3] > symbol_df['ema_21'].iloc[-3]
          and symbol_df['close'].iloc[-2] > symbol_df['ema_21'].iloc[-2] 
          and symbol_df['close'].iloc[-1] < symbol_df['ema_21'].iloc[-2]
        )
        or
        ( right == 'P' 
          and current_bid > entry_price
          and (skip_tp1_check or is_executed_take_profits(application_state, symbol, take_profit_list=['tp1'])) 
          and symbol_df['close'].iloc[-3] < symbol_df['ema_21'].iloc[-3]
          and symbol_df['close'].iloc[-2] < symbol_df['ema_21'].iloc[-2] 
          and symbol_df['close'].iloc[-1] > symbol_df['ema_21'].iloc[-2]
        )
    close_quantity_percentage: 1
    skip_tp1_check: false
    memo: for long after tp1, if we go below last down close candle, then we close the position and vice versa for short

  tp6_trail_w_ema_75:
    enabled: false
    condition: >
        ( right == 'C' 
          and current_bid > entry_price
          and is_executed_take_profits(application_state, symbol, take_profit_list=['tp1']) 
          and symbol_df['close'].iloc[-3] > symbol_df['ema_75'].iloc[-3]
          and symbol_df['close'].iloc[-2] > symbol_df['ema_75'].iloc[-2] 
          and symbol_df['close'].iloc[-1] < symbol_df['ema_75'].iloc[-2]
        )
        or
        ( right == 'P' 
          and current_bid > entry_price
          and is_executed_take_profits(application_state, symbol, take_profit_list=['tp1']) 
          and symbol_df['close'].iloc[-3] < symbol_df['ema_75'].iloc[-3]
          and symbol_df['close'].iloc[-2] < symbol_df['ema_75'].iloc[-2] 
          and symbol_df['close'].iloc[-1] > symbol_df['ema_75'].iloc[-2]
        )
    close_quantity_percentage: 1
    memo: for long after tp1, if we go below last down close candle, then we close the position and vice versa for short


  # Always keep this enable
  # This is for user defined take profit, if user set the take profit, then we will close the position based on that
  tp7_user_defined_take_profit:
    enabled: true
    always_run: true
    multiple_run: true
    close_type: "real_absolute"
    condition: >
      (right == 'C' and underlying_current_price > user_defined_take_profit and user_defined_take_profit not in [0,-1])
      or
      (right == 'P' and underlying_current_price < user_defined_take_profit and user_defined_take_profit not in [0,-1])
    close_quantity_number: user_defined_take_profit_quantity
    memo:


closeness_distance: df['atr_14'].iloc[-2]

closeness_distance_for_chart:
  live: df['atr_14'].tail(10).mean()
  back_test: df.loc[ (df['date'].dt.time == pd.to_datetime('10:00').time()), 'atr_14' ].mean() # for BT, we need to get for 10:00 as for BT we don't go candle base...

closeness_distance_for_case_1: df['atr_14'].iloc[-2] * 2

indicators:
  enabled: False
  calculation_interval_seconds: 60
  print_last_few_rows: True
  details:
      one:
        active: true
        outputs_in_application_state:
        - EMA_9
        calculation: |
          df['EMA_9'] = df['close'].ewm(span=9, adjust=False).mean()
