        - price_retest_v2(app_config, application_state, case, symbol, df, side='up', idx_list=[-2,-3], level=long_level, level_alias=level_alias)
        - set_and_is_retest_after_breakout(application_state, symbol, case, side='up', level=long_level)
        - does_arc_has_enough_heights(app_config, application_state, case, symbol, df, side='up', level=long_level, level_alias=level_alias, min_height_atr_ratio=0.5)
        - check_arc_duration(app_config, application_state, case, symbol, df, side='up', level=long_level, level_alias=level_alias, arc_min_bars=4)
        - check_close_displacement(app_config, application_state, case, symbol, df, side='up', level=long_level, level_alias=level_alias, min_close_disp_atr=0.1)
        - price > long_level and df.iloc[-1]['open'] > long_level and df.iloc[-1]['close'] > df.iloc[-1]['open']
      extras:
        - is_second_candle_after(min_seconds=15)
        - 9 == 9
        - has_strong_close(df, side='up') or df['close'].iloc[-1] > df['high'].iloc[-2]
        - is_symbol_in_rs_shortlist(app_config, application_state, symbol, side='up', threshold=5)


